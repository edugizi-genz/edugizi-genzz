<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Evaluasi Pre-Test & Post-Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans antialiased">

    <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
        
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <span id="quiz-type-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200 uppercase tracking-wider">
                    Pre-Test
                </span>
                <h1 id="quiz-title" class="text-xl font-extrabold text-slate-800 mt-2">Evaluasi Pemahaman Materi</h1>
                <p class="text-xs text-slate-500 mt-1">Silakan jawab pertanyaan di bawah ini dengan teliti.</p>
            </div>
            <div id="quiz-header-index" class="text-sm font-bold text-slate-600 bg-slate-50 px-4 py-2 rounded-xl border border-slate-200">
                Soal 1 dari 5
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            
            <div class="md:col-span-3 space-y-4">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <div class="space-y-2">
                        <p id="quiz-question-text" class="text-sm font-semibold text-slate-800 leading-relaxed">
                            Memuat soal...
                        </p>
                    </div>

                    <div id="quiz-options-container" class="space-y-2.5">
                        </div>

                    <div id="quiz-feedback-box" class="hidden transition-all duration-300">
                        </div>
                </div>

                <div class="flex justify-between items-center gap-4">
                    <button id="btn-quiz-prev" onclick="navigateQuiz(-1)" class="px-4 py-2.5 text-xs font-bold text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 disabled:opacity-50 disabled:pointer-events-none transition flex items-center gap-2">
                        ‹ Sebelumnya
                    </button>
                    <button id="btn-quiz-action" onclick="handleQuizAction()" class="px-5 py-2.5 text-xs font-bold text-white bg-emerald-600 border border-emerald-600 rounded-xl hover:bg-emerald-700 transition shadow-sm">
                        Soal Berikutnya ›
                    </button>
                </div>
            </div>

            <div class="md:col-span-1">
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-4 sticky top-6">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Navigasi Soal</h3>
                    <div id="quiz-nav-nums" class="grid grid-cols-4 gap-2">
                        </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const databaseSoal = [
            {
                q: "Manakah dari berikut ini yang merupakan komponen utama dari hardware komputer?",
                o: ["Sistem Operasi", "CPU (Central Processing Unit)", "Browser Internet", "Aplikasi Microsoft Word"],
                c: 1
            },
            {
                q: "Apa fungsi utama dari RAM pada perangkat komputer?",
                o: ["Menyimpan data secara permanen", "Memproses grafis game tingkat tinggi", "Tempat penyimpanan data sementara saat aplikasi berjalan", "Melindungi komputer dari virus"],
                c: 2
            },
            {
                q: "Protokol standar yang digunakan untuk mengamankan komunikasi data di web browser adalah...",
                o: ["HTTP", "FTP", "HTTPS", "SMTP"],
                c: 2
            },
            {
                q: "Manakah yang termasuk dalam kategori perangkat input (masukan)?",
                o: ["Monitor", "Printer", "Keyboard", "Proyektor"],
                c: 2
            },
            {
                q: "Sistem bilangan yang hanya menggunakan angka 0 dan 1 disebut sistem bilangan...",
                o: ["Desimal", "Biner", "Oktal", "Heksadesimal"],
                c: 1
            }
        ];

        let tipeKuisAktif = 'pretest'; // Pilihan: 'pretest' atau 'posttest'
        let currentQuizIndex = 0;
        let jawabanSiswa = Array(databaseSoal.length).fill(null);

        function initQuiz(tipe) {
            tipeKuisAktif = tipe;
            currentQuizIndex = 0;
            jawabanSiswa = Array(databaseSoal.length).fill(null);
            
            // Atur Badge Header
            const badge = document.getElementById('quiz-type-badge');
            if(tipe === 'pretest') {
                badge.innerText = "Pre-Test";
                badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200 uppercase tracking-wider";
            } else {
                badge.innerText = "Post-Test";
                badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 uppercase tracking-wider";
            }

            renderNavNumbers();
            showQuizQuestion(0);
        }

        function renderNavNumbers() {
            const navBox = document.getElementById('quiz-nav-nums');
            navBox.innerHTML = "";
            databaseSoal.forEach((_, i) => {
                const btn = document.createElement('button');
                btn.id = `q-num-${i}`;
                btn.innerText = i + 1;
                btn.onclick = () => showQuizQuestion(i);
                navBox.appendChild(btn);
            });
        }

        function showQuizQuestion(idx) {
            currentQuizIndex = idx;
            document.getElementById('quiz-header-index').innerText = `Soal ${idx + 1} dari ${databaseSoal.length}`;
            
            document.querySelectorAll('#quiz-nav-nums button').forEach((b, i) => {
                if(jawabanSiswa[i] !== null) {
                    b.className = "p-2 text-center text-xs font-bold rounded-xl text-white bg-emerald-600 border border-emerald-600 cursor-pointer";
                } else {
                    b.className = "p-2 text-center text-xs font-bold rounded-xl text-slate-500 border border-slate-200 hover:bg-slate-50 cursor-pointer";
                }
            });
            const activeNum = document.getElementById(`q-num-${idx}`);
            if(activeNum) activeNum.className = "p-2 text-center text-xs font-bold rounded-xl ring-2 ring-offset-1 ring-emerald-500 bg-emerald-50 text-emerald-700 border border-emerald-300 cursor-pointer";

           
            const data = databaseSoal[idx];
            document.getElementById('quiz-question-text').innerText = data.q;
            
            const optBox = document.getElementById('quiz-options-container');
            optBox.innerHTML = "";
            
            const feedbackBox = document.getElementById('quiz-feedback-box');
            feedbackBox.classList.add('hidden'); 

            const huruf = ['A', 'B', 'C', 'D'];
            const sudahDijawab = jawabanSiswa[idx] !== null;

            data.o.forEach((opt, oIdx) => {
                const terpilih = jawabanSiswa[idx] === oIdx;
                const apakahBenar = oIdx === data.c;
                
                const optBtn = document.createElement('button');
                optBtn.disabled = sudahDijawab && tipeKuisAktif === 'posttest';
                
                let btnClass = "bg-slate-50/50 border-slate-200 text-slate-700 hover:bg-slate-50";
                let badgeClass = "text-slate-400 border-slate-200";
                
                if (terpilih) {
                    btnClass = "bg-emerald-50 border-emerald-500 text-emerald-900 font-bold";
                    badgeClass = "text-emerald-600 border-emerald-400";
                }
                if (tipeKuisAktif === 'posttest' && sudahDijawab) {
                    if (apakahBenar) {
                        btnClass = "bg-emerald-100 border-emerald-500 text-emerald-900 font-bold pointer-events-none";
                        badgeClass = "bg-emerald-600 text-white border-emerald-600";
                    } else if (terpilih && !apakahBenar) {
                        btnClass = "bg-rose-100 border-rose-500 text-rose-900 font-bold pointer-events-none";
                        badgeClass = "bg-rose-600 text-white border-rose-600";
                    } else {
                        btnClass = "bg-slate-50 opacity-50 border-slate-200 text-slate-400 pointer-events-none";
                    }
                }

                optBtn.className = `w-full text-left p-3 text-xs font-semibold rounded-xl border transition flex items-center gap-3 cursor-pointer ${btnClass}`;
                optBtn.innerHTML = `<span class="w-6 h-6 rounded-lg bg-white flex items-center justify-center border font-bold text-[11px] ${badgeClass}">${huruf[oIdx]}</span> ${opt}`;
                
                optBtn.onclick = () => {
                    jawabanSiswa[idx] = oIdx;
                    showQuizQuestion(idx); 
                };
                optBox.appendChild(optBtn);
            });
            
            if (tipeKuisAktif === 'posttest' && sudahDijawab) {
                const jawabanBenarSiswa = jawabanSiswa[idx] === data.c;
                feedbackBox.classList.remove('hidden');
                
                if (jawabanBenarSiswa) {
                    feedbackBox.innerHTML = `
                        <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 font-medium flex items-start gap-2 animate-fade-in">
                            <i class="fa-solid fa-circle-check text-emerald-600 mt-0.5 text-sm"></i>
                            <div>
                                <strong>Jawaban Anda Benar!</strong> Pilihan yang tepat adalah opsi <strong>${huruf[data.c]}</strong>. Kerja bagus!
                            </div>
                        </div>`;
                } else {
                    feedbackBox.innerHTML = `
                        <div class="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800 font-medium flex items-start gap-2 animate-fade-in">
                            <i class="fa-solid fa-circle-xmark text-rose-600 mt-0.5 text-sm"></i>
                            <div>
                                <strong>Jawaban Anda Salah.</strong> Anda memilih opsi ${huruf[jawabanSiswa[idx]]}. Kunci jawaban yang benar seharusnya adalah <strong>${huruf[data.c]} (${data.o[data.c]})</strong>. Silakan pelajari kembali poin ini.
                            </div>
                        </div>`;
                }
            }

            document.getElementById('btn-quiz-prev').disabled = (idx === 0);
            document.getElementById('btn-quiz-action').innerText = (idx === databaseSoal.length - 1) ? "Kirim Ujian ✓" : "Soal Berikutnya ›";
        }

        function navigateQuiz(direction) {
            const targetIdx = currentQuizIndex + direction;
            if (targetIdx >= 0 && targetIdx < databaseSoal.length) {
                showQuizQuestion(targetIdx);
            }
        })
        function handleQuizAction() {
            if (currentQuizIndex < databaseSoal.length - 1) {
                showQuizQuestion(currentQuizIndex + 1);
            } else {
                // Hitung Skor Akhir Siswa
                let skorBenar = 0;
                databaseSoal.forEach((item, i) => {
                    if (jawabanSiswa[i] === item.c) skorBenar++;
                });
                const totalSkor = Math.round((skorBenar / databaseSoal.length) * 100);

                alert(`--- HASIL ${tipeKuisAktif.toUpperCase()} ---\n\nTotal Benar: ${skorBenar} dari ${databaseSoal.length} Soal\nNilai Akhir: ${totalSkor}`);
                
                if(tipeKuisAktif === 'pretest') {
                    if(confirm("Pre-Test selesai! Apakah Anda ingin langsung memulai Post-Test dengan pembahasan interaktif?")) {
                        initQuiz('posttest');
                    }
                } else {
                    alert("Selamat! Anda telah menyelesaikan seluruh rangkaian evaluasi.");
                }
            }
        }
        window.onload = function() {
            initQuiz('pretest');
        };
    </script>
</body>
</html>
